<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Bot Status</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background-color: #f0f2f5; }
        h1 { color: #075e54; }
        #status { margin: 20px; font-size: 20px; font-weight: bold; }
        #qr-container img { width: 300px; height: 300px; border: 4px solid #075e54; border-radius: 10px; }
        #log { margin-top: 20px; text-align: left; max-width: 500px; margin-left: auto; margin-right: auto; background: white; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>WhatsApp Bot Control</h1>
    <div id="status">Waiting for QR code...</div>
    <div id="qr-container"></div>
    <div id="log"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const logDiv = document.getElementById('log');

        function logMessage(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            logDiv.appendChild(p);
        }

        socket.on('qr', (qrImage) => {
            document.getElementById('status').innerText = 'Scan this QR code with WhatsApp:';
            document.getElementById('qr-container').innerHTML = `<img src="${qrImage}" alt="QR Code">`;
            logMessage('QR code received');
        });

        socket.on('ready', () => {
            document.getElementById('status').innerText = '✅ WhatsApp connected!';
            document.getElementById('qr-container').innerHTML = '';
            logMessage('WhatsApp connected');
        });

        socket.on('disconnect', () => {
            logMessage('Disconnected from server');
        });
    </script>
</body>
        </html>
