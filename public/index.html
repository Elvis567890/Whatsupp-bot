<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Smart Bot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; max-width: 550px; width: 95%; }
        h1 { color: #333; margin-bottom: 20px; }
        #status { margin: 20px 0; font-size: 18px; font-weight: bold; color: #555; }
        #qr-image { max-width: 280px; margin: 20px auto; display: block; border: 4px solid #eee; border-radius: 8px; }
        .instructions { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: left; font-size: 14px; margin-top: 20px; }
        .dashboard { display: none; text-align: left; }
        .mode-selector { margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; }
        .mode-selector h4 { margin: 0 0 10px 0; }
        .mode-btn { display: inline-block; padding: 8px 15px; margin: 5px; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s; }
        .mode-btn.active { box-shadow: 0 4px 10px rgba(0,0,0,0.2); transform: scale(1.05); }
        .mode-normal { background: #ccc; color: #333; }
        .mode-hungry { background: #ff9800; color: white; }
        .mode-happy { background: #4CAF50; color: white; }
        .mode-sleepy { background: #3f51b5; color: white; }
        .mode-pickupline { background: #e91e63; color: white; }
        .chat-list { max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        .chat-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .chat-item:hover { background: #f0f0f0; }
        .send-box { display: flex; gap: 10px; }
        .send-box input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .send-box button { padding: 10px 20px; background: #25D366; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        .refresh-btn { margin-top: 20px; padding: 10px 20px; background: #f44336; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 5px; z-index: 1000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Smart Bot</h1>
        <div id="status">Connecting...</div>
        
        <img id="qr-image" style="display:none;" />
        <div class="instructions" id="instructions">
            <strong>How to link:</strong>
            <ol>
                <li>Open WhatsApp</li>
                <li>Settings → Linked Devices → Link a Device</li>
                <li>Scan the current QR code</li>
            </ol>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="mode-selector">
                <h4>🎭 Bot Personality Mode</h4>
                <button class="mode-btn mode-normal" onclick="setMode('normal')">Normal</button>
                <button class="mode-btn mode-hungry" onclick="setMode('hungry')">🍔 Hungry</button>
                <button class="mode-btn mode-happy" onclick="setMode('happy')">😊 Happy</button>
                <button class="mode-btn mode-sleepy" onclick="setMode('sleepy')">😴 Sleepy</button>
                <button class="mode-btn mode-pickupline" onclick="setMode('pickupline')">💘 Pick-up</button>
            </div>

            <h3>💬 Chats</h3>
            <div class="chat-list" id="chat-list"></div>
            
            <div class="send-box">
                <input type="text" id="msg" placeholder="Broadcast to all..." />
                <button onclick="broadcast()">Broadcast</button>
            </div>
        </div>

        <button class="refresh-btn" onclick="location.reload()">Refresh</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const status = document.getElementById('status');
        const qrImage = document.getElementById('qr-image');
        const instructions = document.getElementById('instructions');
        const dashboard = document.getElementById('dashboard');
        const chatList = document.getElementById('chat-list');
        const msgInput = document.getElementById('msg');
        
        const socket = io();
        let currentMode = 'normal';

        socket.on('connect', () => status.textContent = 'Connected! Waiting for QR...');
        socket.on('disconnect', () => status.textContent = 'Disconnected!');

        socket.on('qr', (data) => {
            status.textContent = '📱 New QR generated! Scan it now.';
            status.style.color = 'orange';
            dashboard.style.display = 'none';
            instructions.style.display = 'block';
            qrImage.src = data;
            qrImage.style.display = 'block';
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = 'QR updated! Scan the new code.';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        });

        socket.on('ready', () => {
            status.textContent = '✅ Connected!';
            status.style.color = 'green';
            qrImage.style.display = 'none';
            instructions.style.display = 'none';
            dashboard.style.display = 'block';
        });

        socket.on('dashboard_data', (data) => {
            currentMode = data.currentMode || 'normal';
            highlightMode();
            chatList.innerHTML = '';
            data.chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `<span>${chat.isGroup ? '👥' : '👤'}</span> <span>${chat.name}</span>`;
                div.onclick = () => {
                    const msg = prompt('Send direct message to ' + chat.name + ':');
                    if (msg) socket.emit('send_to_chats', { chatIds: [chat.id], message: msg });
                };
                chatList.appendChild(div);
            });
        });

        socket.on('mode_updated', (mode) => {
            currentMode = mode;
            highlightMode();
        });

        socket.on('send_result', (r) => { if (r.success) alert('✅ Sent!'); else alert('❌ ' + r.error); });

        function setMode(mode) {
            socket.emit('set_mode', mode);
            currentMode = mode;
            highlightMode();
        }

        function highlightMode() {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.querySelector('.mode-' + currentMode);
            if (btn) btn.classList.add('active');
        }

        function broadcast() {
            const msg = msgInput.value.trim();
            if (msg) { socket.emit('send_to_chats', { chatIds: [], message: msg }); msgInput.value = ''; }
        }
    </script>
</body>
</html>
