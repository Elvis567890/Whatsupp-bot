<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Bot Dashboard</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background-color: #f0f2f5; }
        h1 { color: #075e54; }
        #status { margin: 20px; font-size: 20px; font-weight: bold; }
        #qr-container img { width: 300px; height: 300px; border: 4px solid #075e54; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>WhatsApp Bot Control Panel</h1>
    <div id="status">Waiting for QR code...</div>
    <div id="qr-container"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on('qr', (qrImage) => {
            document.getElementById('status').innerText = 'Scan this QR code with WhatsApp:';
            document.getElementById('qr-container').innerHTML = `<img src="${qrImage}" alt="QR Code">`;
        });
        socket.on('ready', () => {
            document.getElementById('status').innerText = '✅ WhatsApp connected!';
            document.getElementById('qr-container').innerHTML = '';
        });
    </script>
</body>
</html>
